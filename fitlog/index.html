const SB_PROJECT="zwkmboddrxvezkephvda", WATCH_PID="saurabh";
const W={state:"idle",data:null,err:null,at:0,busy:false};
const WATCH_SQL=`select json_build_object(
 'device',(select row_to_json(x) from (select app_version,battery,last_upload from public.devices where person='saurabh' order by last_upload desc nulls last limit 1) x),
 'days',(select coalesce(json_agg(d order by d.date),'[]'::json) from (select date,steps,kcal_active,kcal_total,floors,distance_m,exercise_min,active_hours,water_ml,sleep_min,hrv,hourly from public.daily_summary where person='saurabh' and date>=current_date-35) d),
 'workouts',(select coalesce(json_agg(w order by w.start_ts desc),'[]'::json) from (select id,start_ts,end_ts,exercise_type,avg_hr,max_hr,kcal,distance_m,steps,zones from public.workouts where person='saurabh' and start_ts>=now()-interval '35 days') w),
 'sleep',(select coalesce(json_agg(z order by z.start_ts desc),'[]'::json) from (select start_ts,end_ts,total_min from public.sleep_sessions where person='saurabh' and start_ts>=now()-interval '14 days') z),
 'hr',(select coalesce(json_agg(h order by h.ts),'[]'::json) from (select ts,value v from public.samples where person='saurabh' and type='hr_1m' and ts>=now()-interval '26 hours') h),
 'body',(select coalesce(json_agg(b order by b.date),'[]'::json) from (select date,json from public.labels where person='saurabh' and kind='body_comp' and date>=current_date-120) b)
) as data`;
function parseSql(payload){
  let t=payload;
  if(typeof t==="string"){try{const o=JSON.parse(t); if(o&&typeof o.result==="string") t=o.result; else if(o&&typeof o==="object") t=o;}catch(_){}}
  if(t&&typeof t==="object"&&!Array.isArray(t)){ if(typeof t.result==="string") t=t.result; else if(t.data) return t.data; }
  if(Array.isArray(t)){const r=t[0]; return r&&r.data?r.data:r;}
  t=String(t);
  const m=t.match(/<untrusted-data-[^>]*>\s*(\[[\s\S]*?\])\s*<\/untrusted-data/); if(m) t=m[1]; else {const a=t.indexOf("[{"), b=t.lastIndexOf("}]"); if(a>=0&&b>a) t=t.slice(a,b+2);}
  const rows=JSON.parse(t); const r=Array.isArray(rows)?rows[0]:rows; return r&&r.data?r.data:r;
}
async function loadWatch(force){
  if(!mcp||W.busy) return; if(!force&&W.data&&Date.now()-W.at<5*60e3) return;
  W.busy=true; if(!W.data) W.state="loading"; render();
  const run=()=>mcp.callTool("Supabase","execute_sql",{project_id:SB_PROJECT,query:WATCH_SQL},{cache:false});
  try{
    let res; try{res=await run();}catch(e){ if(e&&e.retryable){await new Promise(r=>setTimeout(r,(e.retryAfterMs||1500)+Math.random()*800)); res=await run();} else throw e; }
    W.data=parseSql(res.payload!=null?res.payload:(res.content||[]).map(c=>c.text||"").join("")); W.at=Date.now(); W.state="ok"; W.err=null;
  }catch(e){
    W.err=e||{}; const c=W.err.code;
    if(["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy","approval_required","selection_required"].includes(c)) W.data=null;
    W.state=W.data?"ok":"error";
  }
  W.busy=false; render();
}
function watchErrMsg(e){
  const c=e&&e.code;
  if(c==="needs_reauth") return "Supabase sign-in expired. Reconnect it in claude.ai → Settings → Connectors.";
  if(c==="server_not_connected"||c==="selection_required") return "Add the Supabase connector in claude.ai → Settings → Connectors, then refresh.";
  if(c==="approval_required") return "Watch data needs your OK to use Supabase on this page.";
  if(c==="not_in_manifest") return "Supabase isn't allowed for this page in this view.";
  if(c==="blocked_by_policy") return "Your organization blocks this Supabase tool.";
  if(c==="tool_error") return "Supabase answered with an error: "+String(e.message||"").slice(0,140);

  return "Couldn't load watch data"+(e&&e.message?": "+String(e.message).slice(0,120):".");

function today(){return new Date().toLocaleDateString("en-CA");}
function shift(d,n){const t=new Date(d+"T12:00:00");t.setDate(t.getDate()+n);return t.toLocaleDateString("en-CA");}
function fmtDay(d){const t=new Date(d+"T12:00:00");const lbl=d===today()?"Today":d===shift(today(),-1)?"Yesterday":"";return (lbl?lbl+", ":"")+t.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function prof(){return Object.assign({},DEFAULTS[S.pid],S.profiles[S.pid]||{});}
function day(d){return S.days[S.pid][d||S.date]||{date:d||S.date};}
function sumFoods(dy){let k=0,p=0;(dy.foods||[]).forEach(f=>{k+=+f.kcal||0;p+=+f.protein||0;});return {k:Math.round(k),p:Math.round(p)};}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

// ---------- Persistence ----------
const queues={};
function saveDay(mutate){
  const pid=S.pid, d=S.date;
  const cur=JSON.parse(JSON.stringify(day(d))); cur.date=d; mutate(cur); cur.updated=Date.now();
  S.days[pid][d]=cur; render();
  if(!db) return;
  const path=`people/${pid}/days/${d}`;
  queues[path]=(queues[path]||Promise.resolve()).then(()=>db.doc(path).set(cur)).catch(e=>{toast("Couldn't save: "+(e&&e.message||"try again"));});
}
function saveProfile(patch){
  const pid=S.pid; const cur=Object.assign({},prof(),patch);
  S.profiles[pid]=cur; render();
  if(!db) return Promise.resolve();
  return db.doc(`people/${pid}`).set(cur).then(()=>toast("Plan saved")).catch(e=>toast("Couldn't save plan: "+(e&&e.message||"try again")));
}
function saveProfileQuiet(patch,msg){
  const pid=S.pid; const cur=Object.assign({},prof(),patch);
  S.profiles[pid]=cur; render();
  if(!db) return Promise.resolve();
  return db.doc(`people/${pid}`).set(cur).then(()=>{if(msg)toast(msg);}).catch(e=>toast("Couldn't save: "+(e&&e.message||"try again")));
}
function tplKcal(t){return Math.round((t.items||[]).reduce((a,x)=>a+(+x.kcal||0),0));}
function subscribe(){
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[];
  if(!db) return;
  ["saurabh","priyanka"].forEach(pid=>{
    unsubs.push(db.doc(`people/${pid}`).onSnapshot(s=>{ if(s.exists){S.profiles[pid]=Object.assign({},s.data());} render(); },e=>toast("Plan didn't load: "+(e.message||e.code))));
    unsubs.push(db.collection(`people/${pid}/days`).orderBy("date","desc").limit(120).onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>{m[d.id]=Object.assign({},d.data());}); S.days[pid]=m; render();
    },e=>toast("Logs didn't load: "+(e.message||e.code))));
    unsubs.push(db.collection(`people/${pid}/photos`).orderBy("at","desc").limit(60).onSnapshot(snap=>{
      S.photos[pid]=snap.docs.map(d=>Object.assign({id:d.id},d.data())); if(S.tab==="progress") render();
    },()=>{}));
  });
}

// ---------- Rendering ----------
const view=document.getElementById("view");
function render(){
  const p=prof();
  document.getElementById("hello").textContent=`${p.name}'s Fit Log`;
  document.getElementById("phase").textContent=p.phase||"";
  document.querySelectorAll(".who button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pid===S.pid)));
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  const keepFocus=document.activeElement&&document.activeElement.id; const caret=document.activeElement&&document.activeElement.selectionStart;
  const sy=window.scrollY;
  view.innerHTML=({today:vToday,food:vFood,progress:vProgress,ask:vAsk,plan:vPlan})[S.tab](p);
  if(keepFocus){const el=document.getElementById(keepFocus); if(el&&el.focus){el.focus(); try{if(caret!=null&&el.setSelectionRange)el.setSelectionRange(caret,caret);}catch(e){}}}
  window.scrollTo(0,sy);
  if(S.tab==="ask"){const c=document.getElementById("chatbox"); if(c) c.scrollTop=c.scrollHeight;}
}
function dayNav(){return `<div class="daynav"><button data-act="prev" aria-label="Previous day">‹</button><div class="d">${esc(fmtDay(S.date))}</div><button data-act="next" aria-label="Next day" ${S.date>=today()?"disabled":""}>›</button></div>`;}
function bar(v,t){const pct=t>0?Math.min(100,v/t*100):0;return `<div class="bar ${v>t?"over":""}"><i style="width:${pct}%"></i></div>`;}

function watchCard(p,dy,s){
  if(!mcp) return `<div class="card wcard stack"><h2>Ghar Watch</h2><p class="small muted" style="margin:0">${W.state==="nomcp"?"Watch data shows when you open this app from its claude.ai link with the Supabase connector connected.":"Connecting…"}</p></div>`;
  if(W.state==="loading"||(!W.data&&W.state==="idle")) return `<div class="card wcard"><p class="small muted" style="margin:0">Loading watch data…</p></div>`;
  if(!W.data) return `<div class="card wcard stack"><h2>Ghar Watch</h2><p class="small" style="margin:0">${esc(watchErrMsg(W.err))}</p><div class="row"><button class="btn sm" data-act="wrefresh">${W.err&&W.err.code==="approval_required"?"Allow and load":"Try again"}</button></div></div>`;
  const d=W.data, wd=wDay(S.date), isToday=S.date===today();
  const dev=d.device||{}; const synced=dev.last_upload?new Date(dev.last_upload):null;
  const sleepH=wSleepFor(S.date), hrv=wd&&wd.hrv?+wd.hrv:null, base=hrvBaseline(S.date);
  let intensity="normal", why=[];
  if(sleepH!=null&&sleepH<6){intensity="easy";why.push(`only ${sleepH.toFixed(1)} h sleep`);}
  if(hrv&&base){const r=hrv/base; if(r<=0.85){intensity="easy";why.push(`HRV ${Math.round((r-1)*100)}% vs normal`);} else if(r>=1.1&&(sleepH==null||sleepH>=7)&&intensity!=="easy"){intensity="hard";why.push(`HRV +${Math.round((r-1)*100)}% vs normal`);}}
  if(!why.length) why.push(base?"recovery in normal range":"baseline still building (needs 3 morning HRV readings)");
  const left=p.kcal-s.k;
  const m=(lbl,val,unit)=>`<div class="wm"><span class="lbl">${lbl}</span><span class="val">${val}<small>${unit?" "+unit:""}</small></span></div>`;
  const ex=wd?wd.exercise_min||0:0, ah=wd?wd.active_hours||0:0;
  const steps=wd&&wd.steps!=null?(+wd.steps).toLocaleString("en-IN"):"–";
  const hourly=wd&&wd.hourly||null;
  return `<div class="card wcard stack">
   <div class="row" style="justify-content:space-between"><h2>${isToday?"Morning briefing":"From the watch"}</h2><button class="btn sm alt" data-act="wrefresh" ${W.busy?"disabled":""}>${W.busy?"…":"Refresh"}</button></div>
   ${isToday?`<div class="brief"><span class="pill ${intensity}">${intensity==="hard"?"Go hard":intensity==="easy"?"Take it easy":"Normal day"}</span><span class="small muted grow">${esc(why.join(" · "))}</span></div>
   <div class="small">${left>=0?`<b class="num">${left}</b> kcal left to eat`:`<b class="num">${-left}</b> kcal over`} · sleep <b class="num">${sleepH!=null?sleepH.toFixed(1)+" h":"–"}</b> · HRV <b class="num">${hrv?Math.round(hrv)+" ms":"–"}</b>${base?` <span class="muted">(7-day ${Math.round(base)})</span>`:""}</div>`:""}
   <div class="wgrid">
    ${m("Steps",steps,"")}${m("Move",wd&&wd.kcal_active!=null?wd.kcal_active:"–","kcal")}${m("Exercise",ex,"min")}
    ${m("Active hrs",ah,"h")}${m("Distance",wd&&wd.distance_m?(wd.distance_m/1000).toFixed(1):"–","km")}${m("Total burn",wd&&wd.kcal_total!=null?(+wd.kcal_total).toLocaleString("en-IN"):"–","kcal")}
   </div>
   ${hourly&&hourly.steps?`<div><h3 style="margin-bottom:4px">Steps by hour</h3>${hourBars(hourly.steps,"var(--teal)")}</div>`:""}
   ${isToday&&d.hr&&d.hr.length?`<div><h3 style="margin-bottom:4px">Heart rate today</h3>${hrLine(d.hr)}</div>`:""}
   <p class="small muted" style="margin:0">${synced?`Watch synced ${synced.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false})}`:"Watch hasn't synced yet"}${dev.battery!=null?` · battery ${dev.battery}%`:""}${dev.app_version?` · v${esc(dev.app_version)}`:""}. Data arrives when the watch syncs (on the charger, or Sync now).</p>
  </div>`;
}
function hourBars(arr,color){
  const w=520,h=90,L=4,R=4,T=6,B=18,n=24,hi=Math.max(1,...arr.map(v=>+v||0));
  const slot=(w-L-R)/n,bw=slot*.62,y=v=>T+(hi-v)*(h-T-B)/hi;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="per hour">
   <line x1="${L}" x2="${w-R}" y1="${h-B}" y2="${h-B}" stroke="var(--line)"/>
   ${arr.map((v,i)=>+v>0?`<rect x="${L+i*slot+(slot-bw)/2}" y="${y(+v)}" width="${bw}" height="${Math.max(2,h-B-y(+v))}" rx="2" fill="${color}"><title>${i}:00 · ${Math.round(v)}</title></rect>`:"").join("")}
   ${[0,6,12,18].map(i=>`<text x="${L+i*slot}" y="${h-4}" font-size="11" fill="var(--muted)">${String(i).padStart(2,"0")}</text>`).join("")}
  </svg>`;
}
function hrLine(pts){
  const w=520,h=120,L=30,R=8,T=14,B=18;
  const xs=pts.map(p=>new Date(p.ts).getTime()), vs=pts.map(p=>+p.v);
  const t0=Math.min(...xs), t1=Math.max(Date.now(),t0+3*3600e3);
  const lo=Math.min(...vs)-5, hi=Math.max(...vs)+5, x=t=>L+(t-t0)/(t1-t0)*(w-L-R), y=v=>T+(hi-v)/(hi-lo)*(h-T-B);
  let path="",prev=null; pts.forEach((p,i)=>{const t=xs[i]; path+=(prev!=null&&t-prev<=15*60e3?"L":"M")+x(t).toFixed(1)+","+y(vs[i]).toFixed(1); prev=t;});
  const mi=vs.indexOf(Math.max(...vs)), avg=Math.round(vs.reduce((a,b)=>a+b,0)/vs.length);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="heart rate">
   <line x1="${L}" x2="${w-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${L-4}" y="${y(avg)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${avg}</text>
   <path d="${path}" fill="none" stroke="#e5484d" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${x(xs[mi])}" cy="${y(vs[mi])}" r="4" fill="#e5484d"/><text x="${Math.min(w-R-40,x(xs[mi]))}" y="${y(vs[mi])-6}" font-size="11" fill="#e5484d">max ${Math.round(vs[mi])}</text>
   <text x="${L}" y="${h-4}" font-size="11" fill="var(--muted)">${hm(t0)}</text><text x="${w-R}" y="${h-4}" font-size="11" text-anchor="end" fill="var(--muted)">now</text>
  </svg>`;
}

    const k=fs.reduce((a,f)=>a+(+f.kcal||0),0);
    return `<div class="meal-h"><h3>${lbl}</h3><span class="small muted num">${Math.round(k)} kcal${compact?"":` <button class="btn sm alt" style="margin-left:6px" data-act="tplsave" data-m="${m}">Save as usual</button>`}</span></div><div class="list">${fs.map(f=>`<div class="item"><div class="grow"><div class="nm">${esc(f.name)}</div><div class="meta">${esc(f.qtyLabel||"")} · ${Math.round(f.protein||0)} g protein</div></div><div class="k">${Math.round(f.kcal||0)}</div><button class="iconbtn" data-act="delf" data-id="${f.id}" aria-label="Remove ${esc(f.name)}">✕</button></div>`).join("")}</div>`;}).join("");
}

function series(n){const out=[];for(let i=n-1;i>=0;i--){const d=shift(today(),-i);out.push([d,S.days[S.pid][d]||{}]);}return out;}
function lineChart(points,{w=520,h=170,goal=null,unit=""}={}){
  const pts=points.filter(p=>p[1]!=null&&!isNaN(p[1]));
  if(pts.length<1) return `<p class="small muted" style="margin:0">No entries yet.</p>`;
  const vals=pts.map(p=>p[1]).concat(goal!=null?[goal]:[]);
  let lo=Math.min(...vals),hi=Math.max(...vals); if(hi-lo<2){lo-=1;hi+=1;} const pad=(hi-lo)*.1; lo-=pad;hi+=pad;
  const L=38,R=10,T=10,B=24, n=points.length;
  const x=i=>L+(n<=1?0:i*(w-L-R)/(n-1)), y=v=>T+(hi-v)*(h-T-B)/(hi-lo);
  const idx=new Map(points.map((p,i)=>[p[0],i]));
  const path=pts.map((p,j)=>`${j?"L":"M"}${x(idx.get(p[0])).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const ticks=[lo+pad,(lo+hi)/2,hi-pad];
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="chart">
   ${ticks.map(t=>`<line x1="${L}" x2="${w-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t.toFixed(t>100?0:1)}</text>`).join("")}
   ${goal!=null?`<line x1="${L}" x2="${w-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="${w-R}" y="${y(goal)-5}" text-anchor="end" font-size="11" fill="var(--accent)">goal ${goal}${unit}</text>`:""}
   <path d="${path}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round"/>
   ${pts.map(p=>`<circle cx="${x(idx.get(p[0]))}" cy="${y(p[1])}" r="3" fill="var(--teal)"/>`).join("")}
   <circle cx="${x(idx.get(last[0]))}" cy="${y(last[1])}" r="5" fill="var(--accent)"/>
   <text x="${L}" y="${h-6}" font-size="11" fill="var(--muted)">${esc(fmtShort(points[0][0]))}</text><text x="${w-R}" y="${h-6}" font-size="11" text-anchor="end" fill="var(--muted)">${esc(fmtShort(points[n-1][0]))}</text>
  </svg>`;
}
function barChart(points,target){
  const w=520,h=150,L=38,R=10,T=10,B=24,n=points.length;
  const hi=Math.max(target*1.3,...points.map(p=>p[1]||0),1);
  const bw=(w-L-R)/n*.7, x=i=>L+i*(w-L-R)/n+((w-L-R)/n-bw)/2, y=v=>T+(hi-v)*(h-T-B)/hi;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="calories per day">
   <line x1="${L}" x2="${w-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="${L-6}" y="${y(target)+4}" text-anchor="end" font-size="11" fill="var(--accent)">${target}</text>
   <line x1="${L}" x2="${w-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
   ${points.map((p,i)=>p[1]?`<rect x="${x(i)}" y="${y(p[1])}" width="${bw}" height="${y(0)-y(p[1])}" rx="3" fill="${p[1]>target*1.05?"var(--warn)":"var(--teal)"}"/>`:"").join("")}
   <text x="${L}" y="${h-6}" font-size="11" fill="var(--muted)">${esc(fmtShort(points[0][0]))}</text><text x="${w-R}" y="${h-6}" font-size="11" text-anchor="end" fill="var(--muted)">${esc(fmtShort(points[n-1][0]))}</text>
  </svg>`;
}

function addFood(name,qtyLabel,kcal,protein){saveDay(d=>{d.foods=(d.foods||[]).concat([{id:uid(),name,qtyLabel,kcal:Math.round(kcal),protein:Math.round(protein*10)/10,meal:S.meal,at:Date.now()}]);});toast(`Added ${name}`);}
function contextFor(){
  const p=prof(); const lines=[];
  for(let i=6;i>=0;i--){const d=shift(today(),-i), dy=S.days[S.pid][d]; if(!dy) continue; const s=sumFoods(dy);
    lines.push(`${d}: ${s.k} kcal, ${s.p} g protein, water ${dy.water||0} ml, steps ${dy.steps||0}${dy.weight?`, weight ${dy.weight} kg`:""}${dy.waist?`, waist ${dy.waist} in`:""}${dy.sleep?`, sleep ${dy.sleep} h`:""}; workouts: ${(dy.workouts||[]).map(w=>`${w.type} ${w.min}min ${w.kcal}kcal`).join(", ")||"none"}; foods: ${(dy.foods||[]).map(f=>`${f.name} (${f.qtyLabel}, ${f.kcal} kcal)`).join("; ")||"none"}${dy.notes?`; notes: ${dy.notes}`:""}`);}
  if(S.pid===WATCH_PID&&W.data){
    lines.push("Ghar Watch data (automatic):");
    for(let i=6;i>=0;i--){const d=shift(today(),-i), x=wDay(d), ws=wWorkouts(d); if(!x&&!ws.length) continue;
      lines.push(`${d} watch: steps ${x&&x.steps||0}, active kcal ${x&&x.kcal_active||0}, exercise ${x&&x.exercise_min||0} min, active hours ${x&&x.active_hours||0}${x&&x.hrv?`, morning HRV ${x.hrv} ms`:""}${wSleepFor(d)?`, sleep ${wSleepFor(d).toFixed(1)} h`:""}${x&&x.water_ml?`, water ${x.water_ml} ml (watch)`:""}; workouts: ${ws.map(w=>`${prettyType(w.exercise_type)} ${Math.round((new Date(w.end_ts)-new Date(w.start_ts))/60000)}min ${w.kcal}kcal avgHR ${w.avg_hr||"?"}`).join(", ")||"none"}`);}
    const b=(W.data.body||[]).slice(-1)[0]; if(b) lines.push(`Latest body measurement ${String(b.date).slice(0,10)}: ${JSON.stringify(b.json)}`);
  }
  return `Person: ${p.name}. Phase: ${p.phase}. Diet: ${p.diet}. Targets: ${p.kcal} kcal, ${p.protein} g protein, ${p.water} ml water, ${p.steps} steps. Start weight ${p.startWeight} kg, goal ${p.goalWeight} kg by ${p.goalDate}. Today is ${today()}.\nPlan notes:\n${p.notes||"(none)"}\n\nLast 7 days:\n${lines.join("\n")||"(no logs yet)"}`;
}
async function ask(text){
  if(!sample||S.busy||!text.trim()) return;
  const pid=S.pid; const msgs=S.chat[pid]; msgs.push({role:"user",content:text.trim()});
  const reply={role:"assistant",content:"Thinking…"}; msgs.push(reply); S.busy=true; render();
  const sys=`You are a practical, blunt Indian fitness and diet coach inside a personal tracking app. Answer in short, direct, number-driven points, casual tone (light Hinglish is fine). Use only the person's real data below. Give food ideas with Indian home ingredients and approximate kcal/protein. Never prescribe medicine or supplement doses; say to confirm with their doctor.\n\n${contextFor()}`;
  const convo=msgs.slice(0,-1).slice(-10).map(m=>({role:m.role,content:m.content}));
  while(convo.length&&convo[0].role!=="user") convo.shift();
  convo[0]={role:"user",content:sys+"\n\nQuestion: "+convo[0].content};
  if(convo.length>1) convo[convo.length-1]={role:"user",content:convo[convo.length-1].content+"\n\n(Current data for reference:)\n"+contextFor()};
  try{
    const r=await sample(convo,{cache:false,onText:({text})=>{reply.content=text;const box=document.getElementById("chatbox");if(box&&S.tab==="ask"&&S.pid===pid){const last=box.lastElementChild;if(last)last.textContent=text;box.scrollTop=box.scrollHeight;}}});
    reply.content=r.text;
  }catch(e){reply.content=e&&e.code==="rate_limited"?"Claude is busy right now. Try again in a minute.":e&&e.code==="not_granted"?"Claude access wasn't allowed for this app. You can turn it on from the app's permissions.":"That didn't work: "+(e&&e.message||"try again");}
  S.busy=false; render();
}

    const t={id:uid(),name:nm.slice(0,60),meal:m,items}; saveProfileQuiet({templates:(prof().templates||[]).concat([t])},"Saved as a usual meal");return;}

    saveDay(d=>{d.foods=(d.foods||[]).concat(t.items.map(x=>({id:uid(),name:x.name,qtyLabel:x.qtyLabel,kcal:Math.round(+x.kcal||0),protein:Math.round((+x.protein||0)*10)/10,meal:S.meal,at:Date.now()})));}); toast(`Added ${t.name} (${tplKcal(t)} kcal)`);return;}

  else if(a==="go-food"){S.tab="food";render();window.scrollTo(0,0);}
  else if(a==="meal"){S.meal=b.dataset.m;render();}
  else if(a==="addfood"){const f=FOODS[+b.dataset.i];const m=Math.max(0.25,+document.getElementById("food-mult").value||1);addFood(f.n,(m!==1?m+" × ":"")+f.u,f.k*m,f.p*m);}
  else if(a==="addcustom"){const n=document.getElementById("c-name").value.trim(),k=+document.getElementById("c-kcal").value,pr=+document.getElementById("c-prot").value||0;if(!n||!k){toast("Add a name and calories");return;}addFood(n,"custom",k,pr);}
  else if(a==="estimate"){estimate();}
  else if(a==="saveest"){const it=(S.est&&S.est.items)||[];saveDay(d=>{d.foods=(d.foods||[]).concat(it.map(x=>({id:uid(),name:String(x.name),qtyLabel:String(x.qty||""),kcal:Math.round(+x.kcal||0),protein:Math.round((+x.protein||0)*10)/10,meal:S.meal,at:Date.now(),est:true})));});S.est=null;S.photoFile=null;toast("Meal added");}
  else if(a==="sugg"){ask(b.textContent);}
  else if(a==="ask"){const el=document.getElementById("ask-in");const t=el.value;el.value="";ask(t);}
  else if(a==="clearchat"){S.chat[S.pid]=[];render();}
  else if(a==="saveplan"){const g=id=>document.getElementById(id).value;saveProfile({phase:g("p-phase"),kcal:+g("p-kcal")||1800,protein:+g("p-protein")||100,water:+g("p-water")||3000,steps:+g("p-steps")||8000,startWeight:+g("p-start"),goalWeight:+g("p-goal"),goalDate:g("p-gdate"),diet:g("p-diet"),notes:g("p-notes")});}
});
document.addEventListener("input",e=>{ if(e.target.id==="food-q"){S.q=e.target.value;render();} });
document.addEventListener("change",e=>{
  const id=e.target.id;
  const num=v=>v===""?null:+v;
  if(id==="in-weight") saveDay(d=>{d.weight=num(e.target.value);});
  else if(id==="in-waist") saveDay(d=>{d.waist=num(e.target.value);});
  else if(id==="in-steps") saveDay(d=>{d.steps=num(e.target.value)||0;});
  else if(id==="in-sleep") saveDay(d=>{d.sleep=num(e.target.value);});
  else if(id==="in-notes") saveDay(d=>{d.notes=e.target.value;});
  else if(id==="ai-photo"){S.photoFile=e.target.files[0]||null;const n=document.getElementById("ai-photo-name");if(n)n.textContent=S.photoFile?S.photoFile.name:"";}
  else if(id==="ph-file"){uploadPhoto(e.target.files[0]);}
});
document.addEventListener("keydown",e=>{ if(e.target.id==="ask-in"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();const t=e.target.value;e.target.value="";ask(t);} });

render();

// ---------- Capabilities (light up when available) ----------
const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
use("db").then(d=>{db=d; if(!db){document.getElementById("offline").hidden=false;return;} subscribe();});
use("sample").then(s=>{sample=s; if(s&&s.limits){s.limits().then(c=>{sampleCaps=c;render();}).catch(()=>{});} render();});
use("assets").then(a=>{assets=a; render();});
use("mcp").then(m=>{mcp=m; if(!m){W.state="nomcp";render();return;} loadWatch(true);});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.pid===WATCH_PID) loadWatch(false); });
setTimeout(()=>{ if(!db&&!window.claude){document.getElementById("offline").hidden=false;} },10500);
})();
</script>

</body></html>
